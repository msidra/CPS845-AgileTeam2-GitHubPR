<!DOCTYPE html>
<html lang="en" data-color-mode="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub PR Review · CPS845 Agile Team 2</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <noscript>
    <p style="padding:24px;color:#e6edf3;background:#0d1117;">
      This prototype requires JavaScript. Open <a href="signin.html">the sign-in page</a>.
    </p>
  </noscript>
  <script src="auth.js"></script>
  <script>
    /* Entry point / router:
       - signed in  -> pull request list (US-1.3: go straight to work)
       - signed out -> sign-in page (US-1.3: guard) */
    (function () {
      if (window.Auth && Auth.isSignedIn()) {
        window.location.replace("prs.html");
      } else {
        window.location.replace("signin.html");
      }
    })();
  </script>
</body>
</html>
