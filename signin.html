<!DOCTYPE html>
<html lang="en" data-color-mode="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in to GitHub · GitHub PR Review</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="signin-page">
  <main class="signin" role="main">
    <a href="#" class="signin__logo" aria-label="GitHub">
      <svg height="48" viewBox="0 0 16 16" width="48" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
    </a>
    <h1 class="signin__title">Sign in to GitHub</h1>

    <form class="signin__card" id="signin-form" novalidate>
      <!-- US-1.1: username field -->
      <div class="field">
        <label for="username" class="field__label">Username or email address</label>
        <input type="text" id="username" name="username" class="field__input" autocomplete="username" />
        <!-- US-1.2: per-field error message -->
        <p class="field__error" id="username-error" role="alert" hidden></p>
      </div>

      <!-- US-1.1: password field (hidden characters) -->
      <div class="field">
        <div class="field__label-row">
          <label for="password" class="field__label">Password</label>
          <a href="#" class="field__forgot">Forgot password?</a>
        </div>
        <input type="password" id="password" name="password" class="field__input" autocomplete="current-password" />
        <p class="field__error" id="password-error" role="alert" hidden></p>
      </div>

      <button type="submit" class="btn btn--primary btn--block signin__submit">Sign in</button>
    </form>

    <p class="signin__hint">
      Prototype only. Try <code>sidramusheer</code> / <code>password123</code>,
      or <code>vedula-narayana</code> / <code>password123</code>.
    </p>

    <div class="signin__footer-links">
      <a href="#" class="link">Terms</a>
      <a href="#" class="link">Privacy</a>
      <a href="#" class="link">Docs</a>
      <a href="#" class="link">Contact GitHub Support</a>
    </div>
  </main>

  <script src="data.js"></script>
  <script src="auth.js"></script>
  <script src="signin.js"></script>
</body>
</html>
